<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 수시결과 브리핑</title>
<meta name="description" content="2027학년도 목우미술학원 수시결과 브리핑 · 고1·고2 준입시반">
<meta property="og:title" content="2027학년도 목우 수시결과 브리핑">
<meta property="og:description" content="전체 합격 101건 · 주요대학 68건 (2026. 11. 26. 기준) · 지금부터 준비할 실기와 내신">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<style>
/* =========================================================
   글꼴 — Pretendard Variable
   · PC에 설치되어 있으면 그대로 사용
   · 설치가 안 된 PC: PretendardVariable.woff2 파일을 이 HTML과 같은 폴더에 두면 사용
   · 둘 다 없으면 아래 대체 글꼴 목록 순서로 표시
   ========================================================= */
@font-face{
  font-family:"Pretendard Variable";
  font-weight:45 920;font-style:normal;font-display:swap;
  src:local("Pretendard Variable"),local("PretendardVariable"),
      url("PretendardVariable.woff2") format("woff2-variations"),
      url("PretendardVariable.woff2") format("woff2");
}

/* =========================================================
   디자인 토큰 — 화이트 · 라이트 그레이 · 블루 포인트
   ========================================================= */
:root{
  --bg:#F5F5F7;          /* 기본 슬라이드 배경 */
  --paper:#FFFFFF;       /* 카드 */
  --ink:#1D1D1F;         /* 본문 */
  --ink2:#6E6E73;        /* 보조 텍스트 */
  --ink3:#86868B;        /* 캡션 */
  --line:#E5E5EA; --line2:#D2D2D7;
  --blue:#0071E3; --blue-2:#2997FF; --blue-soft:#E8F1FC; --blue-mid:#7FB4F0;
  --cobalt:var(--blue);  /* (엔진 호환용 별칭) */
  --other:#D2D2D7; --other-2:#A1A1A6;
  --dark:#000000; --dark-2:#1D1D1F; --dark-line:#333336;
  --ok:#1D1D1F;
  --font:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕","Nanum Gothic","나눔고딕",sans-serif;
  --barH:56px;
  --r:24px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0B0B0C;color:var(--ink);font-family:var(--font);word-break:keep-all;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select,textarea{font-family:inherit}

/* =========================================================
   무대(16:9) 스케일링
   ========================================================= */
#viewport{position:fixed;left:0;right:0;top:0;bottom:var(--barH);overflow:hidden}
body.fs #viewport{bottom:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.progress{position:absolute;left:0;top:0;height:4px;background:var(--blue);z-index:5;transition:width .5s cubic-bezier(.25,.1,.25,1)}
.progress-track{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.05);z-index:4}

/* =========================================================
   슬라이드 공통
   ========================================================= */
.slide{position:absolute;inset:0;padding:92px 120px 0;opacity:0;visibility:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.slide.active{opacity:1;visibility:visible;z-index:2}
.slide.anim{animation:fadeUp .7s cubic-bezier(.25,.1,.25,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide.dark{background:var(--dark);color:#F5F5F7}
.notes-page{display:none}

.kicker{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600;letter-spacing:-.005em;color:var(--blue);margin-bottom:18px}
.kicker b{font-weight:600;color:var(--ink3);font-size:21px;font-variant-numeric:tabular-nums}
.dark .kicker{color:var(--blue-2)}
.dark .kicker b{color:#6E6E73}
h1.hl{font-size:60px;line-height:1.16;font-weight:700;letter-spacing:-.035em;margin:0 0 20px;max-width:1300px}
h1.hl em{font-style:normal;color:var(--blue)}
.dark h1.hl em{color:var(--blue-2)}
p.sub{font-size:25px;line-height:1.55;font-weight:500;letter-spacing:-.01em;color:var(--ink2);margin:0;max-width:1180px}
.dark p.sub{color:#A1A1A6}
.body{flex:1;min-height:0;margin-top:40px;display:flex;flex-direction:column}
.sf{display:flex;justify-content:space-between;gap:40px;align-items:center;height:60px;margin:0 -120px;padding:0 120px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink3);flex-shrink:0;letter-spacing:-.005em}
.dark .sf{border-color:var(--dark-line);color:#6E6E73}
.sf .pg{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink2)}
.dark .sf .pg{color:#A1A1A6}

/* 배지 */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:999px;font-size:14.5px;font-weight:500;background:#E8E8ED;color:var(--ink);white-space:nowrap}
.bdg.warn{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.bdg.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.bdg.ok{background:var(--blue-soft);color:var(--blue)}
.bdg.ok::before{content:"✓";font-weight:700}
.bdg.blue{background:var(--blue-soft);color:var(--blue)}
.dark .bdg{background:#1D1D1F;color:#F5F5F7}
.dark .bdg.warn{background:transparent;color:#A1A1A6;box-shadow:inset 0 0 0 1px #48484A}

/* =========================================================
   1. 표지 / 9. 마무리 — 가운데 정렬
   ========================================================= */
.cover{justify-content:center;padding-top:0;text-align:center}
.cover-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;z-index:1}
.cover .rule{display:none}
.cover .eyebrow{font-size:24px;font-weight:600;color:var(--blue-2);letter-spacing:-.01em;margin-bottom:22px}
.cover h1{font-size:92px;line-height:1.08;font-weight:700;letter-spacing:-.045em;margin:0 0 26px;max-width:1300px}
.cover .subt{font-size:36px;color:#A1A1A6;font-weight:500;letter-spacing:-.02em;margin:0 0 52px}
.cover .meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* 1장 배경: 2027 무빙 포스터 (제목·글씨는 고정, 뒤 배경만 천천히 움직임) */
.cbg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.cbg .orb{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.cbg .o1{width:640px;height:640px;left:-160px;top:-220px;background:radial-gradient(circle,rgba(41,151,255,.55),transparent 66%)}
.cbg .o2{width:600px;height:600px;right:-180px;bottom:-240px;background:radial-gradient(circle,rgba(94,92,230,.5),transparent 66%)}
.cbg .o3{width:420px;height:420px;left:58%;top:-60px;background:radial-gradient(circle,rgba(255,111,181,.22),transparent 66%)}
.cbg .big{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);font-size:340px;font-weight:800;line-height:1;letter-spacing:-.06em;white-space:nowrap}
.cbg .big span{display:inline-block;color:transparent;background:linear-gradient(180deg,rgba(41,151,255,.26),rgba(41,151,255,0) 78%);-webkit-background-clip:text;background-clip:text;will-change:transform}
.cbg .ghost{bottom:-20px;font-size:420px;opacity:.9}
.cbg .ghost span{background:none;-webkit-text-stroke:1.2px rgba(120,180,255,.16)}
.cbg .sweep{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.05) 50%,transparent 60%);background-size:250% 100%;mix-blend-mode:screen}
.slide.active .cbg .o1{animation:orbA 19s ease-in-out infinite alternate}
.slide.active .cbg .o2{animation:orbB 23s ease-in-out infinite alternate}
.slide.active .cbg .o3{animation:orbC 27s ease-in-out infinite alternate}
.slide.active .cbg .big:not(.ghost) span{animation:dFloat 7s ease-in-out infinite alternate}
.slide.active .cbg .big:not(.ghost) span:nth-child(2){animation-delay:-1.8s;animation-duration:8s}
.slide.active .cbg .big:not(.ghost) span:nth-child(3){animation-delay:-3.6s;animation-duration:6.5s}
.slide.active .cbg .big:not(.ghost) span:nth-child(4){animation-delay:-5.2s;animation-duration:7.5s}
.slide.active .cbg .ghost{animation:gDrift 26s ease-in-out infinite alternate}
.slide.active .cbg .sweep{animation:sweep 9s linear infinite}
@keyframes orbA{to{transform:translate(260px,140px) scale(1.15)}}
@keyframes orbB{to{transform:translate(-300px,-120px) scale(1.1)}}
@keyframes orbC{to{transform:translate(-420px,180px) scale(.85)}}
@keyframes dFloat{from{transform:translateY(14px)}to{transform:translateY(-22px)}}
@keyframes gDrift{from{transform:translateX(-56%)}to{transform:translateX(-44%)}}
@keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){.slide.active .cbg *{animation:none!important}}

/* =========================================================
   2. 오늘의 순서
   ========================================================= */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:auto;margin-bottom:60px}
.step{background:var(--paper);border-radius:var(--r);padding:40px 38px 44px;position:relative}
.step .n{font-size:20px;font-weight:600;color:var(--blue);line-height:1;margin-bottom:40px;font-variant-numeric:tabular-nums}
.step h3{font-size:34px;font-weight:700;margin:0 0 14px;letter-spacing:-.03em}
.step p{font-size:20px;line-height:1.55;color:var(--ink2);margin:0}
.step.hi{background:var(--dark-2);color:#F5F5F7}
.step.hi .n{color:var(--blue-2)}.step.hi p{color:#A1A1A6}

/* =========================================================
   3. 체크 카드
   ========================================================= */
.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:44px;margin-top:auto}
.ck{background:var(--paper);border-radius:20px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:10px;min-height:182px}
.ck .top{display:flex;justify-content:space-between;align-items:center}
.ck .no{font-size:15px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.ck h4{font-size:26px;font-weight:700;margin:4px 0 0;letter-spacing:-.025em}
.ck p{font-size:16.5px;line-height:1.5;color:var(--ink2);margin:0}
.ck .v{margin-top:auto;font-size:14px;color:var(--ink3)}
.ck.lead{background:var(--blue);color:#fff}
.ck.lead .no{color:rgba(255,255,255,.75)!important}
.ck.lead p{color:rgba(255,255,255,.85)}

/* =========================================================
   막대 그래프
   ========================================================= */
.panels{display:grid;gap:24px;flex:1;min-height:0;margin-bottom:30px}
.panel{background:var(--paper);border-radius:var(--r);padding:30px 34px;display:flex;flex-direction:column;min-height:0}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.panel-h h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.panel-h .cap{font-size:14.5px;color:var(--ink3)}
.rows{display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:200px 1fr 130px;align-items:center;gap:20px}
.row .rl{font-size:22px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.row .rl small{display:block;font-size:13.5px;font-weight:500;color:var(--ink3);margin-top:4px;letter-spacing:0}
.row .track{height:40px;position:relative;border-radius:999px;background:#F5F5F7}
.row .bar{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:999px;background:var(--other);transform-origin:left center;transform:scaleX(1)}
.row.home .bar{background:var(--blue)}
.row.home .rl{color:var(--blue)}
.row .rv{font-size:32px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.row .rv span{font-size:16px;font-weight:500;color:var(--ink3);margin-left:3px;letter-spacing:0}
.row.home .rv{color:var(--blue)}
.row .need{position:absolute;inset:0;border:1.5px dashed var(--line2);border-radius:999px;background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(0,0,0,.035) 8px 16px);display:flex;align-items:center;padding-left:20px;font-size:15px;font-weight:500;color:var(--ink2)}
.row .rv.na{font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:0}
.row .rv.none{font-size:16px;color:var(--ink3);font-weight:500;letter-spacing:0}
.row.sm{grid-template-columns:120px 1fr 86px;gap:12px}
.row.sm .rl{font-size:17px}.row.sm .track{height:26px}.row.sm .rv{font-size:22px}.row.sm .rv span{font-size:13px}
.row.sm .need{font-size:12.5px;padding-left:12px}
.row.sm .rv.na,.row.sm .rv.none{font-size:13.5px}

.play .bar{animation:grow 1.4s cubic-bezier(.25,.1,.25,1) both;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.callout{display:flex;align-items:baseline;gap:12px;color:var(--ink);font-size:20px;font-weight:600;align-self:flex-start;letter-spacing:-.02em}
.callout b{font-size:40px;font-weight:700;color:var(--blue);letter-spacing:-.04em}
.note-line{font-size:15px;color:var(--ink2);line-height:1.55}
.note-line strong{color:var(--ink);font-weight:600}
.split-banner{display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 20px;font-size:16.5px;font-weight:500;margin-bottom:18px;box-shadow:inset 3px 0 0 var(--blue)}

.empty{flex:1;border:1.5px dashed var(--line2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:var(--paper);margin-bottom:30px;padding:30px}
.empty .t{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.empty .d{font-size:19px;color:var(--ink2);line-height:1.6;max-width:900px}

/* 대학 카드 */
.ucards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;min-height:0;margin-bottom:26px;align-content:start}
.ucard{background:var(--paper);border-radius:20px;padding:22px 24px}
.ucard h4{font-size:24px;font-weight:700;letter-spacing:-.025em;margin:0 0 16px;display:flex;justify-content:space-between;align-items:baseline}
.ucard h4 small{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0}
.ucard .rows{gap:10px}

/* 지원 자격 */
.qgrid{display:grid;gap:24px;flex:1;min-height:0;margin-bottom:26px}
.qcard{background:var(--paper);border-radius:var(--r);padding:28px 32px}
.qcard.home{box-shadow:inset 0 0 0 2px var(--blue)}
.qcard h3{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center}
.qcard.home h3{color:var(--blue)}
.qcard .row{grid-template-columns:170px 1fr 120px}
.qcard .row .rl{font-size:17px;font-weight:500;color:var(--ink2);letter-spacing:-.01em}
.qcard .row .bar.q1{background:#E8E8ED}.qcard .row .bar.q2{background:var(--other)}.qcard .row .bar.q3{background:var(--other-2)}
.qcard.home .row .bar.q1{background:var(--blue-soft)}.qcard.home .row .bar.q2{background:var(--blue-mid)}.qcard.home .row .bar.q3{background:var(--blue)}
.qcard .metric{margin-top:16px;font-size:15.5px;color:var(--ink2)}
.qcard .metric b{color:var(--ink)}

/* 7. 질문 */
.qs{display:grid;grid-template-columns:1.55fr 1fr;gap:28px;flex:1;min-height:0;margin-bottom:30px}
.qlist{display:flex;flex-direction:column;gap:10px}
.qi{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:start;background:var(--paper);border-radius:18px;padding:16px 24px}
.qi .n{width:36px;height:36px;margin-top:2px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.qi h4{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:2px 0 4px}
.qi p{font-size:15.5px;color:var(--ink2);margin:0;line-height:1.5}
.ours{background:var(--dark-2);color:#F5F5F7;border-radius:var(--r);padding:30px 32px;display:flex;flex-direction:column;gap:12px}
.ours h3{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.ours .kv{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:16.5px;padding:12px 0;border-top:1px solid var(--dark-line)}
.ours .kv span:first-child{color:#86868B}
.ours .kv .na{color:#A1A1A6}
.ours .foot{margin-top:auto;font-size:14px;color:#86868B;line-height:1.55}

/* 8. 준비 */
.prep{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px}
.pcol{border-radius:var(--r);padding:32px 36px;background:var(--paper)}
.pcol h3{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:0 0 20px}
.pcol.a h3{color:var(--blue)}
.pcol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.pcol li{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.45;padding-left:26px;position:relative}
.pcol li::before{content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.pcol.b li::before{background:var(--ink)}
.pcol li small{display:block;font-size:15.5px;font-weight:400;letter-spacing:0;color:var(--ink2);margin-top:2px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:32px;position:relative}
.tl{padding:18px 20px 0 0;position:relative;border-top:2px solid var(--line2)}
.tl::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--line2)}
.tl.now{border-top-color:var(--blue)}
.tl.now::before{background:var(--blue);box-shadow:0 0 0 5px var(--blue-soft)}
.tl b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.tl.now b{color:var(--blue)}
.tl span{font-size:15.5px;color:var(--ink2);line-height:1.45}

/* 9. 마무리 */
.close-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.close-wrap .kicker{justify-content:center}
.close-wrap h1{font-size:72px;line-height:1.15;font-weight:700;letter-spacing:-.045em;margin:0 0 24px;max-width:1300px}
.close-wrap h1 em{font-style:normal;color:var(--blue-2)}
.close-wrap p.sub{margin:0 auto}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:46px 0 40px;width:100%;max-width:1300px;text-align:left}
.pick{border-radius:20px;padding:26px 28px;background:var(--dark-2)}
.pick .n{font-size:14px;font-weight:600;color:var(--blue-2);margin-bottom:10px}
.pick p{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.45;margin:0}
.writein{display:flex;align-items:flex-end;gap:18px;font-size:24px;font-weight:600;letter-spacing:-.02em;width:100%;max-width:1000px}
.writein .ln{flex:1;border-bottom:2px solid #48484A;height:40px}

/* =========================================================
   조작 바, 노트
   ========================================================= */
.controls{position:fixed;left:0;right:0;bottom:0;height:var(--barH);display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(22,22,23,.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:#F5F5F7;border-top:1px solid #2C2C2E;z-index:50;transition:transform .3s ease,opacity .3s ease}
body.fs.idle .controls{transform:translateY(100%);opacity:0}
.controls button{height:34px;min-width:34px;padding:0 16px;border-radius:999px;border:none;background:#2C2C2E;color:#F5F5F7;font-size:14px;font-weight:500;cursor:pointer}
.controls button:hover{background:#3A3A3C}
.controls button:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
.controls button.on{background:var(--blue);color:#fff}
.controls .pgx{min-width:80px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.controls .sep{width:1px;height:22px;background:#3A3A3C;margin:0 8px}
.controls .stored{font-size:12.5px;color:var(--blue-2);margin-left:8px}

/* =========================================================
   모션 베리에이션 — 조작 바 [모션] 버튼 또는 M 키로 전환
   base: 기본 / a: 순차 등장 / b: 키워드 하이라이트 / c: 포커스 스포트라이트
   ========================================================= */
/* A · 순차 등장 */
[data-motion="a"] .slide.anim{animation:fadeOnlyA .3s linear both}
@keyframes fadeOnlyA{from{opacity:0}to{opacity:1}}
[data-motion="a"] .slide.anim .seq{animation:seqIn .65s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--si,0) * 60ms)}
@keyframes seqIn{from{opacity:0;transform:translateY(22px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* B · 키워드 하이라이트 + 숫자 카운트 */
[data-motion="b"] .slide.anim h1 em,[data-motion="b"] .slide.anim p.sub em{background-image:linear-gradient(transparent 60%,rgba(0,113,227,.2) 60%,rgba(0,113,227,.2) 92%,transparent 92%);background-repeat:no-repeat;background-size:0% 100%;animation:hlSweep .9s cubic-bezier(.6,0,.2,1) .45s forwards}
[data-motion="b"] .dark.anim h1 em{background-image:linear-gradient(transparent 62%,rgba(41,151,255,.35) 62%,rgba(41,151,255,.35) 92%,transparent 92%)}
@keyframes hlSweep{to{background-size:100% 100%}}
[data-motion="b"] .play .row.home .bar,[data-motion="b"] .play .cc .bar.c3{overflow:hidden}
[data-motion="b"] .play .row.home .bar::after,[data-motion="b"] .play .cc .bar.c3::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(-120%);animation:sheen 1.1s ease 1.1s 1 forwards}
@keyframes sheen{to{transform:translateX(120%)}}
[data-motion="b"] .slide.anim .cstat{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) .5s both}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

/* C · 포커스 스포트라이트 + 숫자 카운트 */
[data-motion="c"] .slide.anim{animation:fadeOnlyA .25s linear both}
[data-motion="c"] .slide.anim .body,[data-motion="c"] .slide.anim .cover-wrap,[data-motion="c"] .slide.anim .close-wrap{animation:focusIn .9s cubic-bezier(.2,.7,.2,1) both}
[data-motion="c"] .slide.anim h1{animation:focusIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes focusIn{from{opacity:0;transform:scale(.965);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
[data-motion="c"] .row,[data-motion="c"] .cr,[data-motion="c"] .gtable tbody tr,[data-motion="c"] .dlist li,[data-motion="c"] .pcol li{transition:opacity .6s ease,filter .6s ease}
[data-motion="c"] .slide.focus .row:not(.home),
[data-motion="c"] .slide.focus .ucols .rows:first-child .row:nth-child(n+4),
[data-motion="c"] .slide.focus .ucols .rows:last-child .row,
[data-motion="c"] .slide.focus .cr:not(.focus),
[data-motion="c"] .slide.focus .gtable tbody tr:nth-child(n+5){opacity:.28;filter:grayscale(1)}
[data-motion="c"] .row .track,[data-motion="c"] .cr.focus{transition:box-shadow .6s ease}
[data-motion="c"] .slide.focus .row.home .track{box-shadow:0 0 0 6px rgba(0,113,227,.14)}
[data-motion="c"] .slide.focus .cr.focus{box-shadow:0 0 0 3px rgba(0,113,227,.25)}

@media (prefers-reduced-motion: reduce){
  [data-motion] .slide *,[data-motion] .slide{animation:none!important;filter:none!important}
}
@media print{
  .slide *{animation:none!important;filter:none!important;opacity:1!important}
}

<script>
/* =========================================================
   프레젠테이션 엔진 (수정할 필요 없음 — 문구·숫자는 맨 아래 DATA 영역에서)
   ========================================================= */
(function(){
'use strict';
const NEED='확인 필요';
const STORE='mokwoo-briefing-2027-v3copy-6';   /* 복사본 전용 저장 키 (원본과 섞이지 않게) */
const KINDS=['최초합','추가합','예비','등록','자료에서 구분되지 않음'];
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&isFinite(v);
const has=v=>v!=null&&String(v).trim()!==''&&v!==NEED;
const SRC=()=>(typeof DATA!=='undefined'?DATA:window.DATA);
let D, cur=0, usingStored=false, sessionImgs=[], imgZoom=false, tab='guide';

/* ---------- 데이터 불러오기·저장 ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  const base=clone(SRC());
  try{
    const s=localStorage.getItem(STORE);
    if(s){const st=JSON.parse(s);D=Object.assign(base,st);D.meta=Object.assign(clone(SRC().meta),st.meta||{});usingStored=true;return}
  }catch(e){}
  D=base;
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(D));usingStored=true;flag()}catch(e){}}
function flag(){$('#storedFlag').textContent=usingStored?'● 브라우저에 저장된 수정본 사용 중':''}

/* ---------- 표기 원칙: 반·강사명 차단 ---------- */
function looksLikeClass(n){return /반\s*$/.test(n)||/(선생|강사|쌤|원장)/.test(n)}
function acad(n){n=String(n||'').trim();if(!n||looksLikeClass(n))return '소속 확인 필요';return n}
function compAcademies(){
  const list=D.academies.map(a=>acad(a.name)).filter(n=>n!=='소속 확인 필요');
  const home=D.meta.homeAcademy;
  return [...new Set(list)].sort((a,b)=>(b===home)-(a===home));
}
function basisById(id){return D.bases.find(b=>b.id===id)}

/* ---------- 집계 (확정 값만, 반 단위는 합산 확인된 경우만) ---------- */
function agg(b,a,u){
  const rs=D.records.filter(r=>r.basis===b&&acad(r.academy)===a&&(!u||r.university===u));
  if(!rs.length)return{state:'none'};
  if(rs.some(r=>r.status!=='확정'||!isNum(r.count)))return{state:'need',reason:'판독 값 확인 필요'};
  if(rs.some(r=>r.unit!=='학원 전체'&&r.mergeOk!=='확인'))return{state:'basis',reason:'자료상 집계 기준 확인 필요',value:rs.reduce((s,r)=>s+r.count,0)};
  return{state:'ok',value:rs.reduce((s,r)=>s+r.count,0),kinds:[...new Set(rs.map(r=>r.kind))]};
}
function basisBadges(b){
  /* 슬라이드에는 확인된 정보만 배지로 표시 ('확인 필요' 배지는 띄우지 않음) */
  if(!b)return '';
  const o=[];
  if(has(b.asOf))o.push(`<span class="bdg">기준 시점 ${esc(b.asOf)}</span>`);
  if(b.interim==='최종')o.push('<span class="bdg ok">최종 집계</span>');
  else if(b.interim==='중간 집계')o.push('<span class="bdg">중간 집계</span>');
  if(b.duplicates==='중복 포함')o.push('<span class="bdg">중복 합격 포함</span>');
  else if(b.duplicates==='중복 제외')o.push('<span class="bdg">중복 합격 제외</span>');
  if(has(b.kinds)&&b.kinds!=='자료에서 구분되지 않음')o.push(`<span class="bdg">${esc(b.kinds)}</span>`);
  return o.join('');
}

/* ---------- 막대 한 줄 ---------- */
function barRow(label,res,max,i,opt){
  const h=barRow0(label,res,max,i,opt);
  return opt&&opt.extra!=null?h.slice(0,-6)+'<div class="rx">'+opt.extra+'</div></div>':h;

  if(!el||!animate||motion==='base'||reduceMotion())return;

    el.querySelectorAll(SEQ).forEach((n,k)=>{
      n.classList.add('seq');n.style.setProperty('--si',k);
      n.querySelectorAll('.bar').forEach(b=>b.style.setProperty('--d',(k*0.06+0.25).toFixed(2)+'s'));
    });
  }
  if(motion==='b'||motion==='c')countUp(el);
  if(motion==='c'){
    mTimers.push(setTimeout(()=>el.classList.add('focus'),1300));
    mTimers.push(setTimeout(()=>el.classList.remove('focus'),4300));
  }
}

  img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'msg',innerHTML:`<b>${esc(name)}</b> 파일을 찾을 수 없습니다.<br>HTML과 같은 폴더에 있는지, 파일명(확장자 포함)이 정확한지 확인하세요.`}))};
  img.onclick=()=>{imgZoom=!imgZoom;box.classList.toggle('zoom',imgZoom)};
  const rb=$('#regImg');if(rb)rb.onclick=()=>{const im=sessionImgs.find(x=>'s:'+x.id===v);D.images.push({id:'img'+(D.images.length+1),file:im.name,label:im.name,basis:(D.bases[0]||{}).id||''});save();renderImgSel();if(tab==='images')renderPane();toast('이미지 목록에 등록했습니다')};

function addFiles(files){
  [...files].filter(f=>/^image\//.test(f.type)).forEach(f=>{sessionImgs.push({id:'d'+(sessionImgs.length+1),name:f.name,url:URL.createObjectURL(f)})});
  if(!edOpen()&&!document.body.classList.contains('share'))openEd();
  renderImgSel();$('#imgSel').value='s:'+sessionImgs[sessionImgs.length-1].id;showImg();
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

/* =========================================================
   시작
   ========================================================= */
function init(){
  if(!SRC()){document.body.innerHTML='<p style="color:#fff;padding:40px">DATA 영역을 찾을 수 없습니다.</p>';return}
  load();flag();
  { let mm=null; try{mm=localStorage.getItem(MKEY)}catch(e){}; setMotion(mm||D.meta.motion||'base',false); }
  const m=location.hash.match(/^#(\d+)$/);if(m)cur=+m[1]-1;
  render();fit();show(cur,true);
  addEventListener('resize',fit);
  $('#btnPrev').onclick=()=>go(-1);$('#btnNext').onclick=()=>go(1);
  $('#btnNotes').onclick=()=>{$('#notes').classList.toggle('show');$('#btnNotes').classList.toggle('on')};
  $('#btnEdit').onclick=openEd;$('#edClose').onclick=closeEd;
  $('#btnPrint').onclick=()=>{document.body.classList.remove('print-notes');window.print()};
  $('#btnPrintNotes').onclick=()=>{document.body.classList.add('print-notes');window.print();setTimeout(()=>document.body.classList.remove('print-notes'),500)};
  $('#btnFs').onclick=toggleFs;
  $('#btnMotion').onclick=nextMotion;
  document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fs',!!document.fullscreenElement);$('#btnFs').classList.toggle('on',!!document.fullscreenElement);setTimeout(fit,50);poke()});
  addEventListener('mousemove',poke);
  $('#stage').addEventListener('click',e=>{if(e.target.closest('button,a,input'))return;const r=$('#stage').getBoundingClientRect();go(e.clientX>r.left+r.width*0.3?1:-1)});
  document.addEventListener('keydown',e=>{
    if(edOpen()){if(e.key==='Escape')closeEd();return}
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(1)}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(-1)}
    else if(k==='Home')show(0,true);else if(k==='End')show(PT()-1,true);
    else if(k==='f'||k==='F')toggleFs();
    else if((k==='n'||k==='N')&&!document.body.classList.contains('share'))$('#btnNotes').click();
    else if((k==='e'||k==='E')&&!document.body.classList.contains('share'))openEd();
    else if(k==='m'||k==='M')nextMotion();
  });
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;renderTabs();renderPane()}});
  $('#pane').addEventListener('input',e=>{if(e.target.type==='number'||e.target.type==='text'||e.target.tagName==='TEXTAREA')onEdit(e)});
  $('#pane').addEventListener('change',onEdit);
  $('#pane').addEventListener('click',e=>{
    const bk=e.target.closest('[data-bulk]');
    if(bk){
      const k=bk.dataset.bulk;
      const rows=k==='records'?D.records.filter(r=>isNum(r.count)&&r.status!=='확정'):D.academies.filter(a=>isNum(a.totalAll)&&a.totalStatus!=='확정');
      if(!rows.length){toast('확정할 행이 없습니다');return}
      if(confirm(`숫자가 입력된 ${rows.length}개 행을 “확정”으로 바꿀까요?\n원자료 이미지와 대조를 마친 경우에만 진행하세요.`)){
        rows.forEach(r=>{if(k==='records')r.status='확정';else r.totalStatus='확정'});
        save();renderPane();reRender();toast(rows.length+'개 행을 확정했습니다');
      }
      return;
    }
    const a=e.target.closest('[data-add]'),d=e.target.closest('[data-del]');
    if(a){D[a.dataset.add].push(NEWROW[a.dataset.add]());save();renderPane();reRender();const p=$('#pane');p.scrollTop=p.scrollHeight}
    if(d){const [k,i]=d.dataset.del.split(':');if(confirm('이 행을 삭제할까요?')){D[k].splice(+i,1);save();renderPane();reRender();if(k==='images')renderImgSel()}}
  });
  $('#imgSel').onchange=showImg;
  $('#imgZoom').onclick=()=>{imgZoom=!imgZoom;showImg()};
  $('#filePick').onchange=e=>addFiles(e.target.files);
  const dz=$('#drop');
  ['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();dz.classList.add('over')}}));
  ['dragleave','drop'].forEach(t=>document.addEventListener(t,()=>dz.classList.remove('over')));
  document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>

      notes: '이 장의 메시지는 두 가지입니다. 내신은 원서를 쓸 수 있는 티켓이고, 합격은 실기가 만듭니다.\n자랑할 부분: 목우 선배들은 내신이 높지 않았습니다. 2026학년도 합격생 133명 중 3등급 이내는 16명(약 12%)뿐이고, 절반 이상이 4~5등급대였습니다. 그런데도 경기대(합격생 평균 5.12등급), 동덕여대(4.44등급), 단국대(4.40등급) 같은 대학에 합격했습니다. 이건 목우의 실기 지도가 만든 결과입니다.\n그래서 여러분에게 하고 싶은 말: 실기는 목우가 끝까지 끌어올립니다. 여기에 내신까지 갖추면 숙명여대·홍익대·한양대(평균 2.9~3.1등급)처럼 더 위쪽 대학에도 원서를 쓰고 실기로 승부할 수 있습니다. 목우는 내신으로 원서 자격을 먼저 갖추고 실기로 승부하는 방식으로 입시를 진행합니다.\n표의 평균 내신은 2024~2026학년도 목우 수시 합격자 기준(9등급제)입니다. 여러분은 5등급제라 그대로 옮기지 말고 수준을 가늠하는 용도로만 설명해 주세요. 한양대 서울·ERICA는 합격 건수가 적어 참고용입니다.' },
